# Publish gate — openspec/changes/distribution-pass, task 4.1.
#
# Publishing is authorized only by a grown @fcon-tech/portolan version on a
# merge to main. Mechanism: compare package.json against its first-parent
# previous commit (`git show HEAD^:package.json`) — on a merge commit HEAD^
# is the pre-merge tip, so the diff is exactly what the merge introduced;
# no ambiguity with multi-parent history.
#
# No long-lived secrets: npm trusted publishing (OIDC) only — no NPM_TOKEN.
# Before the Governor's one-time setup (first manual release + trusted
# publisher config) the package does not exist on npm; the gate script
# detects the 404, reports BLOCKED naming the missing step, and exits
# nonzero without attempting a publish (spec: "Account-bound steps belong
# to the Governor").
name: Publish

# Runs only after CI finished on the same ref — a publish never precedes a
# green verification run. `workflow_run` fires on completion of the named
# workflow; for a push to main, `head_branch` is 'main' and `head_sha` is the
# pushed (merge) commit, so checkout pins that exact tree and the HEAD^
# version comparison runs against the merged checkout (HEAD^ = the
# merge's first parent, i.e. the pre-merge main tip — the diff is exactly
# what the merge introduced, unchanged from the previous push trigger).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit CI ran on; fetch-depth 2 keeps first-parent
          # history for the HEAD^ version comparison.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - name: Gate (publish / skip / blocked)
        run: bun scripts/publish-gate.ts
        id: gate

      # Reached only when the gate printed "publish <version>": the version
      # grew and the package already exists on npm (trusted publisher
      # configured). npm >= 11.5.1 on Node 22 is required for OIDC publish.
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.decision == 'publish'
        with:
          node-version: 22

      - name: Install npm with trusted-publishing support
        if: steps.gate.outputs.decision == 'publish'
        run: npm install -g npm@11.5.1

      - name: Publish to npm (OIDC, no secrets)
        if: steps.gate.outputs.decision == 'publish'
        run: npm publish
